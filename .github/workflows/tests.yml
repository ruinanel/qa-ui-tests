name: UI tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff (линтер)
        run: ruff check .
      - name: Ruff format (проверка стиля)
        run: ruff format --check .
      - name: Mypy (проверка типов)
        run: mypy .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # не останавливать остальные браузеры при падении одного
      matrix:
        browser: [chromium, firefox, webkit]   # кросс-браузерность
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run tests (parallel + selected browser)
        run: pytest -v -n auto --browser ${{ matrix.browser }}
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
